name: Bank of America Angular Modernization Simulation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce framework, consumer and repository policy
        run: ./scripts/gate.sh compliance
      - name: Typecheck both applications
        run: ./scripts/gate.sh typecheck
      - name: Lint every project
        run: ./scripts/gate.sh lint
      - name: Run unit and downstream contract tests
        run: ./scripts/gate.sh unit
      - name: Build both full application consumers
        run: ./scripts/gate.sh build
      - name: Install the isolated browser runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise Retail Banking and Customer Servicing
        run: ./scripts/gate.sh e2e
      - name: Record coverage
        run: ./scripts/gate.sh coverage
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-of-america-demo-browser-evidence
          path: |
            evidence/browser
            coverage
          if-no-files-found: ignore
          retention-days: 7
